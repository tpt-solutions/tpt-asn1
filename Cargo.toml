[workspace]
resolver = "2"
members = [
    "crates/tpt-asn1-core",
    "crates/tpt-asn1-compiler",
    "crates/tpt-asn1-x509",
    "crates/tpt-asn1-cms",
    "crates/tpt-asn1-cli",
    "xtask",
]
# tpt-asn1-crypto is its own workspace: RustCrypto dependencies need a newer
# toolchain than the 1.81 MSRV pinned for this one. See its README.
exclude = [
    "crates/tpt-asn1-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81.0"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-asn1"
homepage = "https://github.com/tpt-solutions/tpt-asn1"
keywords = ["asn1", "der", "ber", "x509", "pki"]
categories = ["cryptography", "encoding", "parser-implementations"]

[workspace.dependencies]
tpt-asn1-core = { version = "0.1.0", path = "crates/tpt-asn1-core" }
tpt-asn1-x509 = { version = "0.1.0", path = "crates/tpt-asn1-x509" }
tpt-asn1-cms = { version = "0.1.0", path = "crates/tpt-asn1-cms" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
