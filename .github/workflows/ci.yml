name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Build & test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose

  msrv:
    name: MSRV build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain (1.81.0)
        uses: dtolnay/rust-toolchain@1.81.0
      - uses: Swatinem/rust-cache@v2
      - name: Build (no default features where applicable)
        run: cargo build --workspace

  no_std:
    name: no_std / no_alloc check (tpt-asn1-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@1.81.0
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Build core without std/alloc for bare-metal target
        run: cargo build -p tpt-asn1-core --no-default-features --target thumbv7em-none-eabi

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        # Latest cargo-audit requires the edition2024 feature (Rust >= 1.85),
        # which the repo-pinned 1.81.0 toolchain cannot build. Use stable.
        uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    name: Fuzz targets (build + smoke)
    runs-on: ubuntu-latest
    # The fuzz crate is a standalone workspace; it never builds under the
    # MSRV/stable matrix. Compilation needs the sanitizer-runtime shipped with
    # nightly, so this job pins its own toolchain. RUSTFLAGS with "-D warnings"
    # is disabled here because it also applies to libfuzzer-sys' build script.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build all fuzz targets
        run: cargo +nightly fuzz build
      - name: Smoke-run each fuzz target
        run: |
          set -euo pipefail
          for target in core_tlv core_universal x509_certificate x509_crl x509_ocsp cms_content_info cms_signed_data; do
            echo "== smoke: $target =="
            cargo +nightly fuzz run "$target" -- -runs=2000 -max_len=4096
          done

  fuzz-soak:
    name: Fuzz soak (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    env:
      RUSTFLAGS: ""
      SOAK_SECONDS: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Soak-run each fuzz target
        run: |
          set -u
          failed=0
          for target in core_tlv core_universal x509_certificate x509_crl x509_ocsp cms_content_info cms_signed_data; do
            echo "== soak: $target ($SOAK_SECONDS s) =="
            if ! cargo +nightly fuzz run "$target" -- -max_total_time="$SOAK_SECONDS" -max_len=16384 -timeout=25; then
              echo "!! $target reported a finding (see fuzz/artifacts)"
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload crashes
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
