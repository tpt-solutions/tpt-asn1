# This crate is its own workspace. The RustCrypto dependencies need a newer
# toolchain than the 1.81 MSRV of the main workspace, so it has its own lockfile.
[workspace]

[package]
name = "tpt-asn1-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-asn1"
homepage = "https://github.com/tpt-solutions/tpt-asn1"
description = "RustCrypto-backed SignatureVerifier for tpt-asn1-x509 and CMS (RSA PKCS#1 v1.5, ECDSA P-256/P-384, Ed25519)"
readme = "README.md"
keywords = ["x509", "asn1", "signature", "rsa", "ecdsa"]
categories = ["cryptography"]
documentation = "https://docs.rs/tpt-asn1-crypto"

[package.metadata.docs.rs]
all-features = true

[dependencies]
tpt-asn1-x509 = { path = "../tpt-asn1-x509" }
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
signature = "2"

[dev-dependencies]
tpt-asn1-core = { path = "../tpt-asn1-core" }
