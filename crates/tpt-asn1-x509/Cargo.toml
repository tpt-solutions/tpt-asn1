[package]
name = "tpt-asn1-x509"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "X.509v3 certificate parsing, validation, and RFC 5280 6.1 chain building (no_std, fail-closed)"
readme = "README.md"
keywords = ["x509", "asn1", "pki", "certificate", "der"]
categories = ["cryptography", "parser-implementations"]
documentation = "https://docs.rs/tpt-asn1-x509"
# The PKITS and Umbrella fixtures are about 6 MB of test data. They stay in the
# repository for the test suite but are not shipped in the crate tarball.
exclude = ["tests/pkits_data/", "tests/umbrella_corpus/", "tests/pkits_suite.rs.in"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
tpt-asn1-core = { workspace = true }

[features]
default = ["std", "alloc"]
std = ["alloc"]
alloc = []

[dev-dependencies]
# Pure-Rust test-only crypto backend (RSA PKCS#1 v1.5 and DSA signature
# verification for the official NIST PKITS fixtures). Kept out of the public
# dependency graph so the crate stays no_std and free of crypto primitives.
num-bigint = "0.4"
num-traits = "0.2"
sha1 = "0.10"
sha2 = "0.10"
