[package]
name = "tpt-asn1-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = ".tpt-asn1 DSL to Rust code generator: hand-written lexer/parser and Decode/Encode emitter (no_std + alloc)"
readme = "README.md"
keywords = ["asn1", "codegen", "der", "parser", "build"]
categories = ["development-tools::build-utils", "encoding", "parser-implementations"]

[dependencies]
tpt-asn1-core = { workspace = true }

[dev-dependencies]
hex = "0.4"

[features]
default = ["std", "alloc"]
std = ["alloc"]
alloc = []
